<div class="app-shell" [class.menu-open]="menuOpen()">
    <header class="mobile-header">
        <a class="brand brand-mobile" routerLink="/dashboard" (click)="closeMenu()"
            aria-label="Star Wars database, dashboard"><span
                class="brand-mark">SW</span><span>GALACTIC<br><strong>ARCHIVES</strong></span></a>
        <button class="menu-toggle" type="button" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()"
            aria-controls="primary-navigation"
            aria-label="Ouvrir le menu"><span></span><span></span><span></span></button>
    </header>
    <aside class="sidebar" id="primary-navigation">
        <a class="brand" routerLink="/dashboard" (click)="closeMenu()" aria-label="Star Wars database, dashboard"><span
                class="brand-mark">SW</span><span>GALACTIC<br><strong>ARCHIVES</strong></span></a>
        <div class="system-status"><span class="status-dot">●</span> SYSTEM ONLINE <span
                class="status-code">v.21.0</span></div>
        <nav aria-label="Navigation principale">
            <p class="nav-label">Navigation</p>
            @for (item of navItems; track item.route) { <a class="nav-item" [routerLink]="item.route"
                routerLinkActive="active" [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
                (click)="closeMenu()"><span class="nav-icon" aria-hidden="true">{{ item.icon }}</span><span>{{
                    item.label }}</span><span class="nav-arrow" aria-hidden="true">↗</span></a> }
        </nav>
        <div class="sidebar-footer"><span>SECTOR // 07</span><span>© 2026 ARCHIVES</span></div>
    </aside>
    <div class="shell-content">
        <header class="topbar">
            <div class="breadcrumb"><span>ARCHIVES</span><span class="slash">/</span><span>CORE SYSTEM</span></div>
            <div class="topbar-meta"><span class="live-indicator">● LIVE</span><span class="topbar-clock">IMPERIAL
                    NETWORK</span></div>
        </header>
        <main class="page-content"><router-outlet /></main>
    </div>
</div>
